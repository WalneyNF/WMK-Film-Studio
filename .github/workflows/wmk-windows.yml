name: WMK Film Studio - Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main, 'wmk/**']
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wmk-windows.yml'
      - 'README.md'
      - 'assets/wmk/**'
      - 'scripts/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 ZIP
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust 1.95 MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Gerar icone Windows WMK
        run: python scripts/gerar-icone-wmk.py
      - name: Build release
        run: cargo build --release --locked -p filmcraft -p filmcraft-cli
      - name: Testar ferramentas WMK Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'wmk-qa'
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          & .\scripts\WMK-Novo-Projeto.ps1 -Nome 'Teste WMK' -Destino $base -Preset 720p
          $pasta = Join-Path $base 'Teste WMK'
          if (-not (Test-Path (Join-Path $pasta 'wmk-projeto.json'))) { throw 'Manifesto ausente' }
          $manifesto = Get-Content (Join-Path $pasta 'wmk-projeto.json') -Raw | ConvertFrom-Json
          if ($manifesto.largura -ne 1280 -or $manifesto.altura -ne 720) { throw 'Preset invalido' }
          if (-not (Test-Path (Join-Path $pasta '04-projetos'))) { throw 'Pasta de projetos ausente' }
          try {
            & .\scripts\WMK-Novo-Projeto.ps1 -Nome 'Teste WMK' -Destino $base -ErrorAction Stop
            throw 'Falha: permitiu sobrescrever projeto existente'
          } catch {
            if ($_.Exception.Message -like 'Falha: permitiu*') { throw }
          }
          & .\scripts\WMK-Diagnostico.ps1 -PastaAplicativo 'target/release' -Saida (Join-Path $base 'diag.json')
          $diag = Get-Content (Join-Path $base 'diag.json') -Raw | ConvertFrom-Json
          if (-not $diag.executavelPresente) { throw 'Diagnostico nao identificou o binario' }
      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/filmcraft.exe dist/WMK-Film-Studio.exe
          Copy-Item target/release/filmcraft-cli.exe dist/filmcraft-cli.exe
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, ATTRIBUTION.md dist/
          Compress-Archive -Path dist/* -DestinationPath WMK-Film-Studio-Windows-x64.zip -Force
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WMK-Film-Studio-Windows-x64
          path: WMK-Film-Studio-Windows-x64.zip
          retention-days: 30
